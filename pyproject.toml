[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "circuitcare-ai"
version = "0.1.0"
description = "Local Streamlit PCB component review and fault diagnosis"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary - no license granted"}
authors = [{name = "CircuitCare AI contributors"}]
dependencies = ["PyYAML>=6,<7"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
ui = ["streamlit>=1.51,<2", "pandas>=2.1,<4"]
pcb-recognition = ["numpy>=1.26,<3", "opencv-python-headless>=4.10,<5", "Pillow>=10", "torch>=2.3", "torchvision>=0.18", "ultralytics>=8.3", "pandas>=2.1,<4"]
poster = ["matplotlib>=3.8"]
vision = ["numpy>=1.26,<3", "opencv-python-headless>=4.10,<5", "Pillow>=10"]
vision-ai = ["onnxruntime>=1.18,<2"]
vision-ocr = ["rapidocr>=3.10,<4", "onnxruntime>=1.18,<2"]
datasheet = ["pypdf>=5,<7", "pdfplumber>=0.11,<1"]
connectivity = [
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "networkx>=3.2,<4",
  "lightgbm>=4.3,<5",
  "scikit-learn>=1.4,<2",
]

[project.scripts]
circuitcare = "circuitcare.cli:main"
circuitcare-diagnose = "circuitcare.diagnosis_cli:main"
circuitcare-advise = "circuitcare.repair_cli:main"
circuitcare-validate = "circuitcare.benchmark.pcb_validation_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
circuitcare = ["schematic/assets/*.html", "schematic/assets/*.css", "schematic/assets/*.js",
              "dashboard/components/assets/*.html", "dashboard/components/assets/*.css",
              "dashboard/components/assets/*.js", "symptom_diagnosis/knowledge/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires external native or optional runtime dependencies",
    "stress: bounded synthetic stress and soak coverage",
    "crash_injection: intentionally terminates an isolated child process",
  "optional_circuit: regression tests for optional KiCad, SPICE, or legacy circuit UI paths",
  "model_performance: requires local PCB model weights, reference checkout, and labeled images",
]
