rules:
  - {id: R01, name: 전체 무전원, priority: 100, when: {all: [{fact: NO_POWER, operator: eq, value: true}]}, generate: [EXTERNAL_SUPPLY_FAILURE, BATTERY_DEPLETED, CONNECTOR_CONTACT_FAILURE, FUSE_OPEN, DIODE_FAILURE, TRANSFORMER_FAILURE, PCB_TRACE_OPEN]}
  - {id: R02, name: 퓨즈가 있는 보드의 무전원, priority: 95, when: {all: [{fact: NO_POWER, operator: eq, value: true}, {fact: FUSE_PRESENT, operator: eq, value: true}]}, generate: [FUSE_OPEN, DIODE_FAILURE, PCB_TRACE_SHORT]}
  - {id: R03, name: 부하 시 공급 전압 저하, priority: 90, when: {all: [{fact: SUPPLY_VOLTAGE_DROOP, operator: eq, value: true}]}, generate: [EXTERNAL_SUPPLY_FAILURE, BATTERY_DEPLETED, CAPACITOR_SHORT, CAPACITOR_OPEN_OR_DEGRADED, DIODE_FAILURE, INDUCTOR_FAILURE, PCB_TRACE_SHORT, LOAD_FAILURE]}
  - {id: R04, name: LED만 점등하지 않음, priority: 70, when: {all: [{fact: LED_NOT_LIT, operator: eq, value: true}, {fact: OTHER_FUNCTIONS_WORKING, operator: eq, value: true}]}, generate: [LED_FAILURE, SOFTWARE_OR_CONFIGURATION_FAILURE, PCB_TRACE_OPEN]}
  - {id: R05, name: 버저 무음, priority: 70, when: {all: [{fact: BUZZER_NO_SOUND, operator: eq, value: true}]}, generate: [BUZZER_INTERNAL_FAILURE, BUZZER_DRIVER_FAILURE, BUZZER_POWER_FAILURE, CONTROL_CONDITION_FAILURE, SOLDER_JOINT_FAILURE, UNKNOWN_CONNECTION_FAILURE]}
  - {id: R06, name: 디스플레이 무표시, priority: 70, when: {all: [{fact: DISPLAY_BLANK, operator: eq, value: true}]}, generate: [DISPLAY_FAILURE, IC_INTERNAL_FAILURE, IC_SUPPLY_RESET_CLOCK_FAILURE, PCB_TRACE_OPEN]}
  - {id: R07, name: 스위치 입력 무반응, priority: 70, when: {all: [{fact: SWITCH_NO_RESPONSE, operator: eq, value: true}]}, generate: [SWITCH_CONTACT_FAILURE, SWITCH_STUCK, SOFTWARE_OR_CONFIGURATION_FAILURE, SOLDER_JOINT_FAILURE]}
  - {id: R08, name: 릴레이 미동작, priority: 70, when: {all: [{fact: RELAY_NO_ACTUATION, operator: eq, value: true}]}, generate: [RELAY_COIL_FAILURE, TRANSISTOR_FAILURE, IC_INTERNAL_FAILURE, SOLDER_JOINT_FAILURE, PCB_TRACE_OPEN]}
  - {id: R09, name: 릴레이는 동작하지만 부하 무반응, priority: 75, when: {all: [{fact: RELAY_ACTUATES_LOAD_UNRESPONSIVE, operator: eq, value: true}]}, generate: [RELAY_CONTACT_FAILURE, LOAD_FAILURE, PCB_TRACE_OPEN, SOLDER_JOINT_FAILURE]}
  - {id: R10, name: 전원 반복 재시작, priority: 75, when: {all: [{fact: REPEATED_POWER_CYCLE, operator: eq, value: true}]}, generate: [EXTERNAL_SUPPLY_FAILURE, CAPACITOR_OPEN_OR_DEGRADED, IC_SUPPLY_RESET_CLOCK_FAILURE, PCB_TRACE_SHORT]}
  - {id: R11, name: 여러 기능 동시 고장, priority: 80, when: {all: [{fact: MULTIPLE_FUNCTIONS_FAILED, operator: eq, value: true}]}, generate: [EXTERNAL_SUPPLY_FAILURE, IC_SUPPLY_RESET_CLOCK_FAILURE, PCB_TRACE_OPEN, PCB_TRACE_SHORT, COMPOUND_FAILURE]}
  - {id: R12, name: 일부 기능만 고장, priority: 60, when: {all: [{fact: PARTIAL_FUNCTION_FAILURE, operator: eq, value: true}]}, generate: [SOFTWARE_OR_CONFIGURATION_FAILURE, SOLDER_JOINT_FAILURE, PCB_TRACE_OPEN, UNKNOWN_CONNECTION_FAILURE, COMPOUND_FAILURE]}
  - {id: R13, name: 움직임에 따라 증상 변화, priority: 75, when: {all: [{fact: CONNECTOR_MOVEMENT_AFFECTS, operator: eq, value: true}]}, generate: [CONNECTOR_CONTACT_FAILURE, SOLDER_JOINT_FAILURE, PCB_TRACE_OPEN]}
  - {id: R14, name: 시간 경과 후 고장, priority: 65, when: {all: [{fact: DELAYED_FAILURE, operator: eq, value: true}]}, generate: [HEATSINK_THERMAL_CONTACT, CAPACITOR_OPEN_OR_DEGRADED, IC_INTERNAL_FAILURE, TRANSISTOR_FAILURE]}
  - {id: R15, name: 국소 발열, priority: 75, when: {any: [{fact: LOCALIZED_HEATING, operator: eq, value: true}, {fact: OVERHEATING, operator: eq, value: true}]}, generate: [CAPACITOR_SHORT, DIODE_FAILURE, HEATSINK_THERMAL_CONTACT, INDUCTOR_FAILURE, RESISTOR_FAILURE, TRANSFORMER_FAILURE, TRANSISTOR_FAILURE, PCB_TRACE_SHORT]}
  - {id: R16, name: 타이밍 불안정, priority: 70, when: {all: [{fact: TIMING_UNSTABLE, operator: eq, value: true}]}, generate: [CLOCK_OSCILLATOR_FAILURE, IC_SUPPLY_RESET_CLOCK_FAILURE, EXTERNAL_SUPPLY_FAILURE]}
  - {id: R17, name: 간헐 동작, priority: 65, when: {all: [{fact: INTERMITTENT_OPERATION, operator: eq, value: true}]}, generate: [BATTERY_CONTACT_FAILURE, CONNECTOR_CONTACT_FAILURE, CAPACITOR_OPEN_OR_DEGRADED, POTENTIOMETER_FAILURE, SOLDER_JOINT_FAILURE, PCB_TRACE_OPEN, UNKNOWN_CONNECTION_FAILURE]}
  - {id: R18, name: 출력 기능 이상, priority: 65, when: {all: [{fact: OUTPUT_FAILURE, operator: eq, value: true}]}, generate: [LOAD_FAILURE, CONTROL_CONDITION_FAILURE, SOFTWARE_OR_CONFIGURATION_FAILURE, UNKNOWN_CONNECTION_FAILURE, COMPOUND_FAILURE]}
  - {id: R19, name: 버저 소리 이상, priority: 70, when: {all: [{fact: BUZZER_ABNORMAL_SOUND, operator: eq, value: true}]}, generate: [BUZZER_INTERNAL_FAILURE, BUZZER_DRIVER_FAILURE, TRANSISTOR_FAILURE, CONTROL_CONDITION_FAILURE]}
