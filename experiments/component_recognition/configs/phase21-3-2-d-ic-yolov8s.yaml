experiment_id: phase21-3-2-d-pcb-dslr-ic-yolov8s
experiment_type: non_commercial_research_only
model: yolov8s.pt
model_family: YOLOv8s
model_task: detect
class_contract:
  - integrated_circuit
dataset_id: pcb-dslr-part1-ic-research-v1
dataset_manifest: data/component_training/manifests/pcb-dslr-part1-ic-manifest.json
dataset_yaml: data/component_training/processed/pcb-dslr-part1-ic-v3/data.yaml
split_policy: publisher_board_id_grouped
split:
  train: {images: 59, boards: 14}
  validation: {images: 14, boards: 3}
  sealed_test: {images: 14, boards: 3}
train:
  device: mps
  imgsz: 640
  batch: 2
  epochs_max: 50
  patience: 15
  optimizer: auto
  seed: 42
  workers: 2
  cache: false
  amp: false
  augmentation: ultralytics_default_train_only
validation:
  confidence_reporting_threshold: 0.25
  nms_iou: 0.45
  metric_iou: 0.50
  best_checkpoint_metric: mAP50-95
  sealed_test_access: once_after_checkpoint_selection
onnx:
  format: onnx
  imgsz: 640
  opset: 17
  nms: false
  runtime: onnxruntime_cpu
production_model: false
