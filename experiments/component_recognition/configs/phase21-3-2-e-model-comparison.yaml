experiment_id: phase21-3-2-e-yolov8s-vs-yolo26s
experiment_type: non_commercial_research_only
library:
  package: ultralytics
  version: 8.4.203
  python: 3.12.14
  pytorch: 2.15.0
  device: mps
dataset_id: pcb-dslr-part1-ic-research-v1
dataset_manifest: data/component_training/manifests/pcb-dslr-part1-ic-manifest.json
dataset_yaml: data/component_training/processed/pcb-dslr-part1-ic-v3/data.yaml
class_contract: [integrated_circuit]
split:
  train: {images: 59, boards: 14}
  validation: {images: 14, boards: 3}
  historical_previously_exposed_holdout: {images: 14, boards: 3, used_for_selection: false}
training:
  task: detect
  pretrained: true
  imgsz: 640
  batch: 2
  epochs_max: 50
  patience: 15
  seed: 42
  workers: 2
  cache: false
  amp: false
  optimizer: auto
  augmentation: ultralytics_default_train_only
validation:
  checkpoint_metric: mAP50-95
  confidence: 0.25
  nms_iou: 0.45
  matching_iou: 0.50
  mAP_iou_range: [0.50, 0.95]
  small_box_definition_input_px: 32
onnx:
  raw_head_export: {format: onnx, imgsz: 640, opset: 17, nms: null, runtime: onnxruntime_cpu}
  yolo26_one_to_one_export: {format: onnx, imgsz: 640, opset: 17, nms: false, runtime: onnxruntime_cpu}
performance:
  batch: 1
  warmup_calls: 10
  timed_calls_per_path: 100
  preprocessing: letterbox_and_tensor_conversion
  postprocessing: model_specific_decoder
production_model: false
